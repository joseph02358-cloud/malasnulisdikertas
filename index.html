<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>BantuBicara Kaigo - 介護コミュニケーションボード</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans JP (sangat jelas untuk lansia Jepang) & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+JP:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* Pengaturan tinggi viewport dinamis 100dvh agar pas 100% di HP tanpa terpotong bar browser */
        body, html {
            font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Inter', sans-serif;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        /* Animasi Marquee yang mulus menggunakan GPU acceleration */
        @keyframes marquee-scroll {
            0% {
                transform: translate3d(100%, 0, 0);
            }
            100% {
                transform: translate3d(-100%, 0, 0);
            }
        }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
            animation-name: marquee-scroll;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* Mode Cermin (Mirror Mode) */
        .mirror-flip {
            transform: scaleX(-1);
        }

        /* Custom scrollbar halus untuk modal */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Transisi UI kontrol */
        .ui-panel {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }
        .ui-hidden-top {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        .ui-hidden-bottom {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-black text-yellow-400 flex flex-col justify-between select-none transition-colors duration-300" id="app-body">

    <!-- ==================== HEADER / PENGATURAN ATAS RINGKAS ==================== -->
    <header id="top-controls" class="ui-panel z-30 bg-zinc-900/95 backdrop-blur-md border-b border-zinc-800 px-2.5 sm:px-4 py-1.5 sm:py-2 flex items-center justify-between gap-1.5 shadow-lg shrink-0">
        <!-- Brand / Logo Ringkas -->
        <div class="flex items-center gap-1.5 min-w-0 shrink">
            <div class="w-8 h-8 rounded-xl bg-yellow-400 text-black flex items-center justify-center font-black text-lg shadow-sm shrink-0">
                <i class="ph-bold ph-hand-heart"></i>
            </div>
            <div class="truncate">
                <h1 id="ui-app-title" class="text-white font-extrabold text-xs sm:text-sm leading-tight truncate">BantuBicara</h1>
                <p id="ui-app-subtitle" class="text-zinc-400 text-[10px] font-medium truncate hidden sm:block">Kaigo & Tunarungu</p>
            </div>
        </div>

        <!-- Bar Aksi Cepat Header (Semua muat dalam 1 baris di HP kecil) -->
        <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
            <!-- Pengalih Bahasa (ID <-> 日本語) -->
            <button type="button" id="btn-lang-toggle" onclick="toggleUILanguage()" class="h-8 sm:h-9 px-2 sm:px-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-yellow-400 text-[11px] sm:text-xs font-black flex items-center gap-1 border border-yellow-400/40 transition" title="Ganti Bahasa / 言語切替">
                <i class="ph-bold ph-translate text-sm"></i>
                <span id="label-lang">日本語</span>
            </button>

            <!-- Tombol Warna / Tema (Membuka Popover Tema & Mode) -->
            <button type="button" id="btn-theme-toggle" onclick="toggleQuickSettings()" class="h-8 sm:h-9 px-2 sm:px-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white text-[11px] sm:text-xs font-bold flex items-center gap-1 border border-zinc-700 transition" title="Tema & Mode / 配色・表示設定">
                <span id="theme-dot-preview" class="w-3.5 h-3.5 rounded-full bg-yellow-400 border border-white/60 shrink-0"></span>
                <span id="label-theme-btn" class="hidden xs:inline sm:inline">Tema</span>
                <i class="ph-bold ph-caret-down text-[10px] text-zinc-400"></i>
            </button>

            <!-- Tombol Template Kaigo -->
            <button type="button" onclick="openTemplateModal()" class="h-8 sm:h-9 px-2.5 sm:px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-yellow-400 text-[11px] sm:text-xs font-black flex items-center gap-1 border border-yellow-400/50 transition" title="Template Kaigo / 定型文">
                <i class="ph-bold ph-chats-teardrop text-sm"></i>
                <span id="label-template-btn">Template</span>
            </button>

            <!-- Tombol Layar Penuh -->
            <button type="button" onclick="enterFocusMode()" class="h-8 sm:h-9 px-2.5 sm:px-3 rounded-xl bg-yellow-400 hover:bg-yellow-300 active:scale-95 text-black text-[11px] sm:text-xs font-black flex items-center gap-1 shadow-sm transition" title="Layar Penuh / 全画面">
                <i class="ph-bold ph-corners-out text-sm"></i>
                <span id="label-fullscreen" class="hidden sm:inline">Layar Penuh</span>
            </button>
        </div>
    </header>

    <!-- ==================== POPOVER PENGATURAN CEPAT (WARNA, MODE DIAM/BERJALAN, CERMIN) ==================== -->
    <div id="quick-settings-popover" class="hidden fixed top-12 right-2.5 sm:right-4 z-40 w-72 sm:w-80 rounded-2xl bg-zinc-900/95 backdrop-blur-md border border-zinc-700 p-3 shadow-2xl flex flex-col gap-3">
        <!-- Pilihan Tema Kontras Tinggi -->
        <div class="flex items-center justify-between">
            <span id="label-theme" class="text-zinc-300 text-xs font-bold">Warna Layar:</span>
            <div class="flex items-center gap-1.5">
                <button type="button" onclick="setTheme('yellow-black')" data-theme="yellow-black" class="theme-btn w-7 h-7 rounded-full bg-black border-2 border-yellow-400 flex items-center justify-center ring-2 ring-yellow-400 ring-offset-2 ring-offset-zinc-900" title="Hitam & Kuning">
                    <span class="w-3 h-3 rounded-full bg-yellow-400"></span>
                </button>
                <button type="button" onclick="setTheme('white-black')" data-theme="white-black" class="theme-btn w-7 h-7 rounded-full bg-black border-2 border-white flex items-center justify-center opacity-75 hover:opacity-100" title="Hitam & Putih">
                    <span class="w-3 h-3 rounded-full bg-white"></span>
                </button>
                <button type="button" onclick="setTheme('white-navy')" data-theme="white-navy" class="theme-btn w-7 h-7 rounded-full bg-blue-950 border-2 border-white flex items-center justify-center opacity-75 hover:opacity-100" title="Biru Tua & Putih">
                    <span class="w-3 h-3 rounded-full bg-white"></span>
                </button>
                <button type="button" onclick="setTheme('black-white')" data-theme="black-white" class="theme-btn w-7 h-7 rounded-full bg-white border-2 border-zinc-400 flex items-center justify-center opacity-75 hover:opacity-100" title="Putih & Hitam">
                    <span class="w-3 h-3 rounded-full bg-black"></span>
                </button>
            </div>
        </div>

        <!-- Mode Tampilan (Diam vs Berjalan) & Cermin -->
        <div class="flex items-center justify-between gap-2 pt-2 border-t border-zinc-800">
            <button type="button" id="btn-mode-toggle" onclick="toggleScrollMode()" class="flex-1 py-2 px-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold flex items-center justify-center gap-1.5 border border-zinc-700 transition">
                <i id="icon-mode" class="ph-bold ph-align-center-horizontal text-yellow-400 text-sm"></i>
                <span id="label-mode">Diam</span>
            </button>
            <button type="button" id="btn-mirror" onclick="toggleMirror()" class="py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold flex items-center justify-center gap-1.5 border border-zinc-700 transition">
                <i class="ph-bold ph-flip-horizontal text-sm"></i>
                <span id="label-mirror">Cermin</span>
            </button>
        </div>

        <!-- Kecepatan Marquee (Aktif saat Mode Berjalan) -->
        <div id="speed-control-group" class="flex items-center justify-between gap-2 pt-2 border-t border-zinc-800 opacity-40 pointer-events-none transition-opacity">
            <span id="label-speed" class="text-zinc-400 text-xs font-bold shrink-0">Kecepatan:</span>
            <div class="flex bg-zinc-950 p-0.5 rounded-xl border border-zinc-800">
                <button type="button" onclick="setSpeed('slow')" data-speed="slow" id="btn-speed-slow" class="speed-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-zinc-700 text-white transition">Lambat</button>
                <button type="button" onclick="setSpeed('normal')" data-speed="normal" id="btn-speed-normal" class="speed-btn px-2 py-1 rounded-lg text-[11px] font-bold text-zinc-400 hover:text-white transition">Sedang</button>
                <button type="button" onclick="setSpeed('fast')" data-speed="fast" id="btn-speed-fast" class="speed-btn px-2 py-1 rounded-lg text-[11px] font-bold text-zinc-400 hover:text-white transition">Cepat</button>
            </div>
        </div>
    </div>

    <!-- ==================== AREA TAMPILAN UTAMA (STAGE - ZOOM, GESER & PUTAR 90°) ==================== -->
    <main id="display-stage" class="relative flex-1 w-full min-h-0 flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing">
        
        <!-- Layer Transformasi Zoom (Cubit) & Pan (Geser) -->
        <div id="pan-zoom-layer" class="w-full h-full flex items-center justify-center will-change-transform origin-center">
            <!-- Wadah Rotasi 0° / 90° (Dimensi ditukar otomatis saat rotasi 90° agar teks lebar penuh menyamping) -->
            <div id="rotation-box" class="flex items-center justify-center transition-transform duration-300 ease-out">
                <!-- Container Mirror Wrapper -->
                <div id="mirror-wrapper" class="w-full h-full flex items-center justify-center transition-transform duration-200">
                    
                    <!-- MODE 1: TEKS BERJALAN (MARQUEE) -->
                    <div id="marquee-container" class="hidden w-full overflow-hidden flex items-center">
                        <div id="marquee-text" class="marquee-track font-black tracking-wide leading-none" style="font-size: clamp(3.5rem, 16vh, 9rem);">
                            おはようございます。よく眠れましたか？
                        </div>
                    </div>

                    <!-- MODE 2: TEKS DIAM / STATIS (Default untuk Lansia) -->
                    <div id="static-container" class="w-full h-full flex items-center justify-center text-center px-4 sm:px-8">
                        <p id="static-text" class="font-black tracking-normal leading-snug break-words max-w-full" style="font-size: clamp(2.4rem, 8.2vw, 6rem);">
                            おはようございます。よく眠れましたか？
                        </p>
                    </div>

                </div>
            </div>
        </div>

        <!-- Bar Tombol Melayang di Sudut Kiri Atas Area Teks (Putar 90° & Reset Posisi) -->
        <div id="stage-floating-tools" class="absolute top-3 left-3 z-30 flex items-center gap-1.5">
            <!-- Tombol Putar Layar 90° (Selalu mudah dijangkau & menonjol saat di-zoom) -->
            <button type="button" id="btn-rotate-screen" onclick="toggleScreenRotation(event)" class="px-3 py-2 rounded-2xl bg-zinc-900/75 hover:bg-zinc-800 active:scale-95 backdrop-blur-md border border-zinc-700/80 text-white text-xs font-extrabold flex items-center gap-1.5 shadow-lg transition opacity-85 hover:opacity-100" title="Putar Tampilan 90° / 画面回転">
                <i id="icon-rotate" class="ph-bold ph-device-rotate text-yellow-400 text-base transition-transform duration-300"></i>
                <span id="label-rotate">Putar</span>
            </button>

            <!-- Tombol Reset Posisi & Zoom (Muncul saat teks di-zoom atau digeser) -->
            <button type="button" id="reset-transform-btn" onclick="resetPanZoom(event)" class="hidden px-3 py-2 rounded-2xl bg-zinc-900/85 hover:bg-zinc-800 active:scale-95 backdrop-blur-md border border-yellow-400/50 text-yellow-400 text-xs font-extrabold flex items-center gap-1.5 shadow-lg transition">
                <i class="ph-bold ph-arrows-in-cardinal text-base"></i>
                <span id="label-reset-pos">Reset</span>
            </button>
        </div>

        <!-- Badge Persentase Zoom Sementara (Muncul saat cubit zoom in/out) -->
        <div id="zoom-badge" class="hidden absolute top-14 left-1/2 -translate-x-1/2 z-40 px-3 py-1 rounded-full bg-zinc-900/90 backdrop-blur-md border border-zinc-700 text-yellow-400 text-xs font-black flex items-center gap-1.5 shadow-lg pointer-events-none">
            <i class="ph-bold ph-magnifying-glass-plus"></i>
            <span id="zoom-badge-text">100%</span>
        </div>

        <!-- Tombol Keluar Mengambang (Pojok Kanan Atas saat Mode Layar Penuh) -->
        <button type="button" id="floating-exit-btn" onclick="exitFocusMode(event)" class="hidden absolute top-3 right-3 z-30 px-3.5 py-2 rounded-2xl bg-zinc-900/80 hover:bg-zinc-800 active:scale-95 backdrop-blur-md border border-zinc-700/80 text-white text-xs font-extrabold flex items-center gap-1.5 shadow-lg transition opacity-85 hover:opacity-100">
            <i class="ph-bold ph-pencil-simple text-yellow-400 text-base"></i>
            <span id="label-exit-focus">Edit Teks</span>
        </button>

        <!-- Indikator Petunjuk Halus di Bawah (Hanya saat Mode Layar Penuh) -->
        <div id="focus-hint" class="hidden absolute bottom-3 left-1/2 -translate-x-1/2 z-30 px-3.5 py-1.5 rounded-full bg-zinc-900/70 backdrop-blur-md border border-zinc-700/60 text-white/90 text-[11px] font-bold flex items-center gap-1.5 shadow-lg pointer-events-none whitespace-nowrap">
            <i class="ph-bold ph-hand-tap text-yellow-400 text-sm"></i>
            <span id="label-focus-hint">Ketuk layar: Edit • Cubit: Zoom • Putar: 90°</span>
        </div>
    </main>

    <!-- ==================== BAR INPUT BAWAH SUPER RINGKAS (1 BARIS + KEYBOARD INSTAN) ==================== -->
    <section id="bottom-controls" class="ui-panel z-30 bg-zinc-900/95 backdrop-blur-md border-t border-zinc-800 px-2.5 sm:px-4 py-2 shrink-0 shadow-2xl">
        <form onsubmit="handleFormSubmit(event)" class="flex items-center gap-1.5 sm:gap-2">
            <!-- Tombol Edit Instan (Memfokuskan kotak input & memunculkan keyboard HP seketika) -->
            <button 
                type="button" 
                onclick="focusKeyboardInput()" 
                class="h-11 sm:h-12 px-3 rounded-2xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-yellow-400 font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 border border-zinc-700 transition shrink-0"
                title="Ketik Teks / 文字入力"
            >
                <i class="ph-bold ph-keyboard text-lg"></i>
                <span id="label-edit-btn">Edit</span>
            </button>

            <!-- Kotak Input Teks Utama dengan Tombol Hapus (✕) di dalam -->
            <div class="relative flex-1 min-w-0">
                <input 
                    type="text" 
                    id="message-input" 
                    enterkeyhint="done"
                    placeholder="Ketik pesan di sini..." 
                    autocomplete="off"
                    class="w-full h-11 sm:h-12 pl-3.5 pr-9 rounded-2xl bg-zinc-800 text-white placeholder-zinc-400 text-sm sm:text-base font-bold border-2 border-zinc-700 focus:border-yellow-400 focus:outline-none transition"
                >
                <!-- Tombol Hapus (✕) di dalam kotak input -->
                <button 
                    type="button" 
                    onclick="clearInput()" 
                    id="btn-clear"
                    title="Hapus / 消去"
                    class="absolute right-1.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl bg-zinc-700/80 hover:bg-red-500/90 text-zinc-200 hover:text-white flex items-center justify-center transition active:scale-90"
                >
                    <i class="ph-bold ph-x text-sm"></i>
                </button>
            </div>

            <!-- Tombol Kirim / Selesai (OK / 決定) -->
            <button 
                type="submit" 
                class="h-11 sm:h-12 px-3.5 sm:px-5 rounded-2xl bg-yellow-400 hover:bg-yellow-300 active:scale-95 text-black font-black text-xs sm:text-sm flex items-center justify-center gap-1 shadow-md transition shrink-0"
            >
                <i class="ph-bold ph-check text-lg"></i>
                <span id="label-submit">OK</span>
            </button>
        </form>
    </section>

    <!-- ==================== MODAL OVERLAY TEMPLATE KAIGO ==================== -->
    <div id="template-modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center">
        <!-- Latar Belakang Gelap Blur -->
        <div onclick="closeTemplateModal()" class="fixed inset-0 bg-black/75 backdrop-blur-sm"></div>

        <!-- Kontainer Sheet / Kartu Modal -->
        <div class="relative z-10 w-full sm:max-w-2xl max-h-[82dvh] bg-zinc-900 border-t sm:border border-zinc-700 rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden">
            
            <!-- Header Modal -->
            <div class="px-4 py-3 bg-zinc-950/90 border-b border-zinc-800 flex items-center justify-between gap-2 shrink-0">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-yellow-400/15 text-yellow-400 flex items-center justify-center shrink-0">
                        <i class="ph-bold ph-chats-teardrop text-lg"></i>
                    </div>
                    <div>
                        <h2 id="modal-template-title" class="text-white font-black text-sm sm:text-base leading-tight">Template Komunikasi Kaigo</h2>
                        <p id="modal-template-subtitle" class="text-zinc-400 text-[11px] font-medium">Ketuk kalimat untuk tampilkan ke layar</p>
                    </div>
                </div>
                <button type="button" onclick="closeTemplateModal()" class="w-8 h-8 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white flex items-center justify-center transition active:scale-90" title="Tutup / 閉じる">
                    <i class="ph-bold ph-x text-base"></i>
                </button>
            </div>

            <!-- Bar Kategori Kaigo di dalam Modal -->
            <div id="modal-category-tabs" class="px-3 py-2 bg-zinc-900 border-b border-zinc-800 flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0" style="touch-action: pan-x;">
                <!-- Diisi otomatis via JS -->
            </div>

            <!-- Daftar Kalimat Template Kaigo (Bisa di-scroll vertikal di HP kecil) -->
            <div id="modal-phrases-list" class="p-3 overflow-y-auto flex flex-col gap-2 bg-zinc-900/95" style="touch-action: pan-y;">
                <!-- Diisi otomatis via JS -->
            </div>

        </div>
    </div>

    <!-- Notifikasi Toast Mini -->
    <div id="toast-msg" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 px-3.5 py-1.5 rounded-xl bg-zinc-800/95 text-white text-xs font-bold border border-zinc-700 shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 whitespace-nowrap">
        Pesan diperbarui
    </div>

    <script>
        // ==================== DATA & STATE APLIKASI ====================
        const state = {

            theme: "yellow-black",
            speed: "slow",
            activeCategory: "greeting",
            isMirrored: false,
            isFocusMode: false,
            isTemplateOpen: false,

            scale: 1,

        };

        // Kategori & Template Frasa Khusus Kaigo
        const kaigoCategories = [
            {
                id: "greeting",

        // Konfigurasi Tema Kontras Tinggi
        const themes = {
            "yellow-black": { bg: "bg-black", text: "text-yellow-400", dot: "bg-yellow-400" },

        };

        // Kecepatan dasar dalam piksel per detik
        const speedPxPerSec = {
            slow: 125,
            normal: 230,
            fast: 380

        // ==================== ELEMEN DOM ====================
        const appBody = document.getElementById("app-body");
        const displayStage = document.getElementById("display-stage");
        const panZoomLayer = document.getElementById("pan-zoom-layer");
        const rotationBox = document.getElementById("rotation-box");
        const marqueeContainer = document.getElementById("marquee-container");
        const marqueeText = document.getElementById("marquee-text");
        const staticContainer = document.getElementById("static-container");

        const messageInput = document.getElementById("message-input");
        const topControls = document.getElementById("top-controls");
        const bottomControls = document.getElementById("bottom-controls");
        const focusHint = document.getElementById("focus-hint");
        const floatingExitBtn = document.getElementById("floating-exit-btn");
        const resetTransformBtn = document.getElementById("reset-transform-btn");

        // ==================== INISIALISASI ====================
        function init() {
            applyUILanguage();
            renderModalCategoryTabs();
            renderModalPhrases();
            messageInput.value = "";
            setSpeed("slow");
            updateRotationBoxDimensions();
            setupGestures();
            setupViewportListener();
            updateDisplay();

            // Tutup popover pengaturan cepat saat klik di luar
            document.addEventListener("pointerdown", (e) => {
                if (
                    state.isQuickSettingsOpen &&
                    !quickSettingsPopover.contains(e.target) &&
                    !document.getElementById("btn-theme-toggle").contains(e.target)
                ) {
                    closeQuickSettings();
                }
            });

            // Tutup modal dengan tombol Escape
            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    if (state.isTemplateOpen) closeTemplateModal();
                    if (state.isQuickSettingsOpen) closeQuickSettings();
                }
            });
        }

        // ==================== PENYESUAIAN VIEWPORT DINAMIS & KEYBOARD VIRTUAL ====================
        function setupViewportListener() {
            const handleViewportResize = () => {
                // Pastikan tinggi body selalu mengikuti visualViewport saat keyboard HP muncul
                if (window.visualViewport) {
                    appBody.style.height = `${window.visualViewport.height}px`;
                    window.scrollTo(0, 0);
                }
                updateRotationBoxDimensions();
                if (state.mode === "marquee") {
                    recalculateMarqueeSpeed();
                }
            };

            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", handleViewportResize);
                window.visualViewport.addEventListener("scroll", () => window.scrollTo(0, 0));
            }
            window.addEventListener("resize", handleViewportResize);
        }

        // ==================== FOKUS KEYBOARD INSTAN ====================
        function focusKeyboardInput() {
            closeQuickSettings();
            if (state.isFocusMode) {
                exitFocusMode();
            }
            // Fokuskan input segera dalam event klik pengguna agar keyboard HP langsung terbuka
            messageInput.focus();
            // Pindahkan kursor ke akhir teks jika ada isi
            const len = messageInput.value.length;
            messageInput.setSelectionRange(len, len);
        }

        // ==================== KONTROL ROTASI LAYAR 90° (PUTAR / 画面回転) ====================
        function updateRotationBoxDimensions() {
            const stageW = displayStage.clientWidth || window.innerWidth;
            const stageH = displayStage.clientHeight || window.innerHeight;

            if (state.isRotated90) {
                // Tukar dimensi width dan height wadah teks saat diputar 90° agar teks panjang muat menyamping
                rotationBox.style.width = `${stageH}px`;
                rotationBox.style.height = `${stageW}px`;
                rotationBox.style.transform = "rotate(90deg)";
                staticText.style.fontSize = `clamp(2.4rem, ${(stageH * 0.085).toFixed(1)}px, 6.2rem)`;
                marqueeText.style.fontSize = `clamp(3rem, ${(stageW * 0.42).toFixed(1)}px, 8.5rem)`;
            } else {
                rotationBox.style.width = `${stageW}px`;
                rotationBox.style.height = `${stageH}px`;
                rotationBox.style.transform = "rotate(0deg)";
                staticText.style.fontSize = "clamp(2.4rem, 8.2vw, 6rem)";
                marqueeText.style.fontSize = "clamp(3.5rem, 16vh, 9rem)";
            }
        }

        async function toggleScreenRotation(e) {
            if (e) e.stopPropagation();
            const t = i18n[state.uiLang];
            state.isRotated90 = !state.isRotated90;

            // 1. Coba kunci orientasi hardware melalui Screen Orientation API jika didukung saat fullscreen
            try {
                if (screen.orientation && screen.orientation.lock) {
                    if (state.isRotated90 && document.fullscreenElement) {
                        await screen.orientation.lock("landscape").catch(() => {});
                    } else if (!state.isRotated90 && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            } catch (err) {}

            // 2. Terapkan rotasi kanvas 90° yang pasti berhasil di semua perangkat (iOS/Android)
            updateRotationBoxDimensions();
            updateRotateButtonUI();

            if (state.mode === "marquee") {
                recalculateMarqueeSpeed();
            }

            showToast(state.isRotated90 ? t.toastRotatedOn : t.toastRotatedOff);
        }

        function updateRotateButtonUI() {
            const t = i18n[state.uiLang];
            const labelRotate = document.getElementById("label-rotate");
            const isZoomed = Math.abs(state.scale - 1) > 0.04;

            if (state.isRotated90) {
                labelRotate.textContent = t.rotateBtnActive;
                btnRotateScreen.classList.add("bg-yellow-400", "text-black", "border-yellow-400");
                btnRotateScreen.classList.remove("bg-zinc-900/75", "text-white", "border-zinc-700/80");
                iconRotate.classList.remove("text-yellow-400");
                iconRotate.classList.add("text-black", "rotate-90");
            } else {
                labelRotate.textContent = t.rotateBtn;
                btnRotateScreen.classList.remove("bg-yellow-400", "text-black", "border-yellow-400");
                btnRotateScreen.classList.add("bg-zinc-900/75", "text-white");
                iconRotate.classList.add("text-yellow-400");
                iconRotate.classList.remove("text-black", "rotate-90");

                // Menonjolkan border tombol putar saat user melakukan zoom
                if (isZoomed) {
                    btnRotateScreen.classList.add("border-yellow-400", "ring-2", "ring-yellow-400/40", "opacity-100");
                    btnRotateScreen.classList.remove("border-zinc-700/80");
                } else {
                    btnRotateScreen.classList.remove("border-yellow-400", "ring-2", "ring-yellow-400/40");
                    btnRotateScreen.classList.add("border-zinc-700/80");
                }
            }
        }

        // ==================== POPOVER PENGATURAN CEPAT & MODAL TEMPLATE ====================
        function toggleQuickSettings() {
            state.isQuickSettingsOpen = !state.isQuickSettingsOpen;
            if (state.isQuickSettingsOpen) {
                quickSettingsPopover.classList.remove("hidden");
            } else {
                quickSettingsPopover.classList.add("hidden");
            }

        function closeQuickSettings() {
            state.isQuickSettingsOpen = false;
            quickSettingsPopover.classList.add("hidden");
        }

        function openTemplateModal() {
            closeQuickSettings();
            state.isTemplateOpen = true;
            renderModalCategoryTabs();
            renderModalPhrases();
            templateModal.classList.remove("hidden");

        function closeTemplateModal() {
            state.isTemplateOpen = false;
            templateModal.classList.add("hidden");

        // ==================== RENDER KATEGORI & TEMPLATE KAIGO DI DALAM MODAL ====================
        function renderModalCategoryTabs() {
            modalCategoryTabs.innerHTML = "";
            kaigoCategories.forEach(cat => {

        // ==================== GESTURE ZOOM (CUBIT / SCROLL) & GESER (PAN) ====================
        let zoomBadgeTimeout;
        function applyPanZoomTransform(showIndicator = false) {
            panZoomLayer.style.transform = `translate3d(${state.panX}px, ${state.panY}px, 0) scale(${state.scale})`;

            const isModified = Math.abs(state.scale - 1) > 0.03 || Math.abs(state.panX) > 5 || Math.abs(state.panY) > 5;
            if (isModified) {
                resetTransformBtn.classList.remove("hidden");
            } else {
                resetTransformBtn.classList.add("hidden");
            }

            updateRotateButtonUI();

            if (showIndicator) {
                zoomBadgeText.textContent = `${Math.round(state.scale * 100)}%`;
                zoomBadge.classList.remove("hidden");
                clearTimeout(zoomBadgeTimeout);
                zoomBadgeTimeout = setTimeout(() => {
                    zoomBadge.classList.add("hidden");
                }, 1100);
            }
        }

        function resetPanZoom(e) {
            if (e) e.stopPropagation();
            state.scale = 1;
            state.panX = 0;
            state.panY = 0;
            panZoomLayer.style.transition = "transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)";
            applyPanZoomTransform(false);
            setTimeout(() => {
                panZoomLayer.style.transition = "";
            }, 260);
            if (e) {
                showToast(i18n[state.uiLang].toastResetPos);
            }
        }

        function setupGestures() {
            let isDragging = false;
            let hasMoved = false;
            let startX = 0;
            let startY = 0;
            let initialPanX = 0;
            let initialPanY = 0;

            let isPinching = false;
            let initialPinchDist = 0;
            let initialScale = 1;
            let lastTapTime = 0;

            const getTouchDistance = (t1, t2) => {
                return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
            };

            const clampScale = (s) => Math.min(Math.max(s, 0.4), 3.5);

            // --- TOUCH EVENTS (HP & TABLET) ---
            displayStage.addEventListener("touchstart", (e) => {
                if (e.target.closest("button")) return;

                if (e.touches.length === 2) {
                    isPinching = true;
                    isDragging = false;
                    hasMoved = true;
                    initialPinchDist = getTouchDistance(e.touches[0], e.touches[1]);
                    initialScale = state.scale;
                } else if (e.touches.length === 1) {
                    isPinching = false;
                    isDragging = true;
                    hasMoved = false;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    initialPanX = state.panX;
                    initialPanY = state.panY;
                }
            }, { passive: false });

            displayStage.addEventListener("touchmove", (e) => {
                if (isPinching && e.touches.length === 2) {
                    e.preventDefault();
                    const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
                    if (initialPinchDist > 0) {
                        const ratio = currentDist / initialPinchDist;
                        state.scale = clampScale(initialScale * ratio);
                        applyPanZoomTransform(true);
                    }
                } else if (isDragging && e.touches.length === 1) {
                    const dx = e.touches[0].clientX - startX;
                    const dy = e.touches[0].clientY - startY;
                    if (Math.hypot(dx, dy) > 8) {
                        hasMoved = true;
                        e.preventDefault();
                        state.panX = initialPanX + dx;
                        state.panY = initialPanY + dy;
                        applyPanZoomTransform(false);
                    }
                }
            }, { passive: false });

            displayStage.addEventListener("touchend", (e) => {
                if (e.touches.length < 2) {
                    isPinching = false;
                }
                if (e.touches.length === 0) {
                    if (isDragging && !hasMoved && !e.target.closest("button")) {
                        const now = Date.now();
                        if (now - lastTapTime < 280) {
                            resetPanZoom();
                            showToast(i18n[state.uiLang].toastResetPos);
                            lastTapTime = 0;
                        } else {
                            lastTapTime = now;
                            handleStageClick();
                        }
                    }
                    isDragging = false;
                }
            });

            // --- MOUSE EVENTS (DESKTOP / LAPTOP) ---
            displayStage.addEventListener("mousedown", (e) => {
                if (e.button !== 0 || e.target.closest("button")) return;
                isDragging = true;
                hasMoved = false;
                startX = e.clientX;
                startY = e.clientY;
                initialPanX = state.panX;
                initialPanY = state.panY;
            });

            window.addEventListener("mousemove", (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (Math.hypot(dx, dy) > 6) {
                    hasMoved = true;
                    state.panX = initialPanX + dx;
                    state.panY = initialPanY + dy;
                    applyPanZoomTransform(false);
                }
            });

            window.addEventListener("mouseup", (e) => {
                if (!isDragging) return;
                isDragging = false;
                if (!hasMoved && displayStage.contains(e.target) && !e.target.closest("button")) {
                    handleStageClick();
                }
            });

            displayStage.addEventListener("dblclick", (e) => {
                if (e.target.closest("button")) return;
                resetPanZoom();
                showToast(i18n[state.uiLang].toastResetPos);
            });

            // --- WHEEL ZOOM (SCROLL MOUSE / TRACKPAD PINCH) ---
            displayStage.addEventListener("wheel", (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
                state.scale = clampScale(state.scale * zoomFactor);
                applyPanZoomTransform(true);
            }, { passive: false });
        }

        // ==================== LOGIKA TAMPILAN & ANIMASI ====================
        function updateDisplay() {
            const t = i18n[state.uiLang];
            const displayText = state.text.trim() || t.emptyFallback;
            
            marqueeText.textContent = displayText;
            staticText.textContent = displayText;

            Object.values(themes).forEach(th => {
                appBody.classList.remove(th.bg, th.text);
            });
            const activeTheme = themes[state.theme];
            appBody.classList.add(activeTheme.bg, activeTheme.text);

            const dotPreview = document.getElementById("theme-dot-preview");
            if (dotPreview) {
                dotPreview.className = `w-3.5 h-3.5 rounded-full ${activeTheme.dot} border border-white/60 shrink-0`;
            }

            if (state.mode === "marquee") {
                marqueeContainer.classList.remove("hidden");
                staticContainer.classList.add("hidden");
                document.getElementById("speed-control-group").classList.remove("opacity-40", "pointer-events-none");
                recalculateMarqueeSpeed();
            } else {
                marqueeContainer.classList.add("hidden");
                staticContainer.classList.remove("hidden");
                document.getElementById("speed-control-group").classList.add("opacity-40", "pointer-events-none");
            }

            if (state.isMirrored) {
                mirrorWrapper.classList.add("mirror-flip");
            } else {
                mirrorWrapper.classList.remove("mirror-flip");
            }
        }

        function recalculateMarqueeSpeed() {
            marqueeText.style.animationName = "none";
            
            requestAnimationFrame(() => {
                const textWidth = marqueeText.offsetWidth;
                const containerWidth = rotationBox.clientWidth || window.innerWidth;
                const totalDistance = textWidth + containerWidth;
                const pxPerSec = speedPxPerSec[state.speed];
                
                const durationSec = Math.max(3.5, totalDistance / pxPerSec);
                
                marqueeText.style.animationDuration = `${durationSec.toFixed(2)}s`;
                marqueeText.style.animationName = "marquee-scroll";
            });
        }

        // ==================== KONTROL INTERAKSI PENGGUNA ====================
        function handleFormSubmit(e) {
            e.preventDefault();
            const t = i18n[state.uiLang];
            const val = messageInput.value.trim();
            if (val) {
                state.text = val;
                resetPanZoom();
                updateDisplay();
                messageInput.blur();
                enterFocusMode();
            } else {
                messageInput.focus();
                showToast(t.toastEmpty);
            }
        }

        function clearInput() {
            messageInput.value = "";
            messageInput.focus();
            showToast(i18n[state.uiLang].toastCleared);
        }

        function toggleScrollMode() {
            const t = i18n[state.uiLang];
            state.mode = state.mode === "marquee" ? "static" : "marquee";
            
            const label = document.getElementById("label-mode");
            const icon = document.getElementById("icon-mode");
            
            if (state.mode === "marquee") {
                label.textContent = t.modeMarquee;
                icon.className = "ph-bold ph-arrows-left-right text-yellow-400 text-sm";
                showToast(t.toastModeMarquee);
            } else {
                label.textContent = t.modeStatic;
                icon.className = "ph-bold ph-align-center-horizontal text-yellow-400 text-sm";
                showToast(t.toastModeStatic);
            }
            updateDisplay();
        }

        function toggleMirror() {
            const t = i18n[state.uiLang];
            state.isMirrored = !state.isMirrored;
            const btn = document.getElementById("btn-mirror");
            if (state.isMirrored) {
                btn.classList.add("bg-yellow-400", "text-black", "border-yellow-400");
                btn.classList.remove("bg-zinc-800", "text-zinc-300", "border-zinc-700");
                showToast(t.toastMirrorOn);
            } else {
                btn.classList.remove("bg-yellow-400", "text-black", "border-yellow-400");
                btn.classList.add("bg-zinc-800", "text-zinc-300", "border-zinc-700");
                showToast(t.toastMirrorOff);
            }
            updateDisplay();
        }

        function setTheme(themeKey) {
            state.theme = themeKey;
            document.querySelectorAll(".theme-btn").forEach(btn => {
                if (btn.dataset.theme === themeKey) {
                    btn.classList.remove("opacity-75");
                    btn.classList.add("ring-2", "ring-yellow-400", "ring-offset-2", "ring-offset-zinc-900");
                } else {
                    btn.classList.add("opacity-75");
                    btn.classList.remove("ring-2", "ring-yellow-400", "ring-offset-2", "ring-offset-zinc-900");
                }
            });
            updateDisplay();
        }

        function setSpeed(speedKey) {
            state.speed = speedKey;
            document.querySelectorAll(".speed-btn").forEach(btn => {
                if (btn.dataset.speed === speedKey) {
                    btn.classList.add("bg-zinc-700", "text-white");
                    btn.classList.remove("text-zinc-400");
                } else {
                    btn.classList.remove("bg-zinc-700", "text-white");
                    btn.classList.add("text-zinc-400");
                }
            });
            if (state.mode === "marquee") {
                recalculateMarqueeSpeed();
            }
        }

        // ==================== MODE LAYAR PENUH / FOKUS ====================
        function enterFocusMode() {
            closeQuickSettings();
            state.isFocusMode = true;
            topControls.classList.add("ui-hidden-top");
            bottomControls.classList.add("ui-hidden-bottom");
            focusHint.classList.remove("hidden");
            floatingExitBtn.classList.remove("hidden");

            try {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen && !document.fullscreenElement) {
                    docEl.requestFullscreen().catch(() => {});
                } else if (docEl.webkitRequestFullscreen && !document.webkitFullscreenElement) {
                    docEl.webkitRequestFullscreen();
                }
            } catch (err) {}

            setTimeout(() => {
                updateRotationBoxDimensions();
                if (state.mode === "marquee") recalculateMarqueeSpeed();
            }, 150);
        }

        function exitFocusMode(e) {
            if (e) e.stopPropagation();
            state.isFocusMode = false;
            topControls.classList.remove("ui-hidden-top");
            bottomControls.classList.remove("ui-hidden-bottom");
            focusHint.classList.add("hidden");
            floatingExitBtn.classList.add("hidden");

            try {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitFullscreenElement) {
                    document.webkitExitFullscreen();
                }
            } catch (err) {}

            setTimeout(() => {
                updateRotationBoxDimensions();
                if (state.mode === "marquee") recalculateMarqueeSpeed();
            }, 150);
        }

        function handleStageClick() {
            if (state.isFocusMode) {
                exitFocusMode();
                // Langsung munculkan keyboard HP setelah keluar dari mode fokus
                setTimeout(() => {
                    messageInput.focus();
                }, 120);
            } else {
                enterFocusMode();
            }
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById("toast-msg");
            toast.textContent = msg;
            toast.classList.remove("opacity-0");
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add("opacity-0");
            }, 1800);
        }

        window.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
